<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Hub — Blogger Management</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0A0A0F;
    --surface: #13131A;
    --card: #1A1A24;
    --border: #2A2A3A;
    --accent: #C8FF00;
    --accent2: #7C3AED;
    --text: #F0F0F8;
    --muted: #8888AA;
    --ig: #E1306C;
    --tt: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 40px;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em;
    color: var(--text);
  }
  .logo span { color: var(--accent); }
  .nav-tag {
    font-size: 0.72rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
  }
  .nav-right {
    display: flex; align-items: center; gap: 18px;
  }
  .lang-switch {
    display: flex; gap: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px;
  }
  .lang-btn {
    background: none; border: none; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em;
    color: var(--muted); padding: 5px 12px; border-radius: 999px;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn:hover { color: var(--text); }
  .lang-btn.active {
    background: var(--accent); color: #000;
  }

  /* ── HERO ── */
  .hero {
    padding: 90px 40px 60px;
    text-align: center;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse at center, rgba(124,58,237,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow {
    display: inline-block;
    font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
    border: 1px solid rgba(200,255,0,0.3); padding: 4px 14px; border-radius: 999px;
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 700; letter-spacing: -0.04em;
    line-height: 1.08;
    margin-bottom: 18px;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p {
    color: var(--muted); font-size: 1.05rem; max-width: 440px; margin: 0 auto;
    line-height: 1.65;
  }

  /* ── GRID ── */
  .grid-section { padding: 20px 40px 80px; max-width: 1200px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    justify-items: stretch;
    gap: 24px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(200,255,0,0.4);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(200,255,0,0.15);
  }
  .card-img {
    width: 100%; height: 220px; object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #1e1e2e, #2d1b69);
    position: relative;
  }
  .card-img-placeholder {
    width: 100%; height: 220px;
    display: flex; align-items: center; justify-content: center;
    font-size: 4rem;
    background: linear-gradient(135deg, #1A1A2E, #16213E, #0F3460);
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; letter-spacing: -0.04em;
  }
  .card-badge {
    position: absolute; top: 14px; right: 14px;
    background: var(--accent); color: #000;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 999px;
  }
  .card-body { padding: 22px 24px 24px; }
  .card-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .card-niche {
    font-size: 0.8rem; color: var(--muted); margin-bottom: 16px;
  }
  .card-stats {
    display: flex; gap: 16px; margin-bottom: 18px;
  }
  .stat { text-align: center; }
  .stat-val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem; font-weight: 700; color: var(--text);
    display: block;
  }
  .stat-lbl {
    font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .card-socials { display: flex; gap: 8px; }
  .social-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 999px; font-size: 0.73rem; font-weight: 500;
    text-decoration: none; border: 1px solid var(--border);
    transition: background 0.15s, border-color 0.15s;
  }
  .social-pill.ig { border-color: rgba(225,48,108,0.4); color: #E1306C; }
  .social-pill.ig:hover { background: rgba(225,48,108,0.12); }
  .social-pill.tt { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .social-pill.tt:hover { background: rgba(255,255,255,0.06); }
  .card-arrow {
    position: absolute; bottom: 24px; right: 24px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s;
  }
  .card:hover .card-arrow { opacity: 1; transform: scale(1); }

  /* ── PROFILE PANEL ── */
  .overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    display: flex; align-items: flex-start; justify-content: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .panel {
    width: min(560px, 100vw);
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column;
  }
  .overlay.open .panel { transform: translateX(0); }

  .panel-hero {
    position: relative;
    height: 260px;
    background: linear-gradient(135deg, #1A1A2E, #16213E, #0F3460);
    display: flex; align-items: flex-end;
    padding: 24px;
  }
  .panel-hero-bg {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(19,19,26,0.95) 0%, transparent 60%);
  }
  .panel-avatar-letter {
    position: relative; z-index: 1;
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.2rem; font-weight: 700; color: #000;
    margin-right: 18px; flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.15);
  }
  .panel-name-block { position: relative; z-index: 1; }
  .panel-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.8rem; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .panel-niche { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .close-btn {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none;
    color: var(--text); font-size: 1.2rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.15); }

  .panel-body { padding: 28px; flex: 1; }

  .section-label {
    font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px; font-weight: 600;
  }

  /* Social links */
  .social-links { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .social-link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    text-decoration: none; color: var(--text);
    transition: border-color 0.15s, background 0.15s;
    font-size: 0.9rem;
  }
  .social-link:hover { border-color: var(--accent); background: rgba(200,255,0,0.04); }
  .social-link svg { width: 20px; height: 20px; flex-shrink: 0; }
  .social-link .link-info { flex: 1; }
  .link-platform { font-weight: 600; font-size: 0.85rem; }
  .link-handle { font-size: 0.75rem; color: var(--muted); }
  .link-arrow { color: var(--muted); font-size: 0.8rem; }

  /* Stats grid */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 28px;
  }
  .stat-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
  }
  .stat-box-val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem; font-weight: 700; color: var(--accent);
    display: block; margin-bottom: 2px;
  }
  .stat-box-lbl { font-size: 0.75rem; color: var(--muted); }

  /* Tags */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .tag {
    padding: 5px 13px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 500;
    background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3);
    color: #a78bfa;
  }

  /* Collabs */
  .collab-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .collab-item {
    padding: 14px 18px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .collab-brand { font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .collab-desc { color: var(--muted); font-size: 0.78rem; }

  /* Bio */
  .bio-text {
    color: var(--muted); font-size: 0.88rem; line-height: 1.7;
    margin-bottom: 28px;
  }

  /* Divider */
  .divider {
    height: 1px; background: var(--border);
    margin: 0 -28px 28px;
  }

  /* Edit note */
  .edit-note {
    text-align: center; color: var(--muted); font-size: 0.75rem;
    padding: 16px; border-top: 1px solid var(--border);
    margin-top: auto;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    text-align: center; padding: 32px;
    color: var(--muted); font-size: 0.8rem;
  }


  .stat-period {
    font-size: 0.65rem; color: var(--muted); font-weight: 400;
    letter-spacing: 0.02em; display: block; margin-top: 1px;
  }
  /* Last card centered if alone in row */
  .card-last-center {
    grid-column: 1 / -1;
    max-width: 320px;
    margin: 0 auto;
    width: 100%;
  }
  @media (max-width: 700px) {
    .card-last-center {
      grid-column: unset;
      max-width: unset;
      margin: 0;
    }
  }
  @media (max-width: 640px) {
    nav { padding: 14px 20px; }
    .hero { padding: 60px 20px 40px; }
    .grid-section { padding: 20px 20px 60px; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

function t(key) {
  return translations[currentLang][key];
}

function applyStaticTranslations() {
  document.getElementById('nav-tag').textContent = t('navTag');
  document.getElementById('hero-eyebrow').textContent = t('heroEyebrow');
  document.getElementById('hero-title').innerHTML = `${t('heroTitleStart')}<em>${t('heroTitleEm')}</em>`;
  document.getElementById('hero-sub').textContent = t('heroSub');
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  applyStaticTranslations();
  renderGrid();
  // If panel is open, refresh its content too
  if (document.getElementById('overlay').classList.contains('open')) {
    const openId = document.getElementById('overlay').dataset.openId;
    if (openId) {
      const idx = bloggers.findIndex(b => b.id === openId);
      if (idx !== -1) openPanel(bloggers[idx], idx);
    }
  }
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  bloggers.forEach((b, i) => {
    const loc = b.i18n[currentLang];
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openPanel(b, i);
    card.innerHTML = `
      ${b.photo
        ? `<img class="card-img" src="${b.photo}" alt="${b.name}">`
        : `<div class="card-img-placeholder" style="background:${gradients[i]}">${b.name[0]}</div>`
      }
      <div class="card-body">
        <div class="card-name">${b.name}</div>
        <div class="card-stats">

        <div class="link-info">
          <div class="link-platform">${t('tiktok')}</div>

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closePanel(e) {
  if (e.target === document.getElementById('overlay')) closeOverlay();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

// ── FORMAT FOLLOWERS ──────────────────────────────────────────────
function formatFollowers(n) {
  if (!n || n === '—') return '—';
  // Already formatted string like "681K" or "6.9M" → return as-is
  if (typeof n === 'string') return n;
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

// ── AUTO-UPDATE FOLLOWERS ─────────────────────────────────────────
// Numbers are refreshed on a schedule by GitHub Actions (see scripts/update-followers.mjs)
// and stored in data.json. The page just reads that file.
// If the file is missing or fails to load, the hardcoded values above stay on screen.
async function loadFollowers() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    let changed = false;
    bloggers.forEach(b => {
      const s = d.bloggers && d.bloggers[b.id];
      if (!s) return;
      if (s.ig > 0) { b.igFollowers = s.ig; changed = true; }
      if (s.tt > 0) { b.ttFollowers = s.tt; changed = true; }
    });
    if (changed) renderGrid();
  } catch (e) { /* keep hardcoded values */ }
}

applyStaticTranslations();
renderGrid();
// Load fresh follower counts from data.json
loadFollowers();
</script>
