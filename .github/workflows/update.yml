name: Update followers

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch follower counts
        run: node scripts/update-followers.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "followers-bot"
          git config user.email "followers-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update followers" && git push)
